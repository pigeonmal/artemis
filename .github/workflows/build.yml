name: Linux Build & Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'
  CONTAINER_IMAGE: fedora:latest

jobs:
  build-linux:
    name: Build on Fedora Linux
    runs-on: ubuntu-latest

    outputs:
      package-path: ${{ steps.archive.outputs.package-path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Build Environment
        run: |
          echo "Using container image: $CONTAINER_IMAGE"
          docker pull $CONTAINER_IMAGE

      - name: Build inside Fedora container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/workspace:z \
            -w /workspace \
            $CONTAINER_IMAGE \
          bash -euxc "
            dnf -y update
            dnf -y groupinstall 'Development Tools'
            dnf -y install \
              git \
              qt6-qtbase-devel qt6-qttools-devel qt6-qtmultimedia-devel \
              openssl-devel SDL2-devel SDL2_ttf-devel opus-devel ffmpeg-devel \
              libX11-devel libXrandr-devel freetype-devel mesa-libGL-devel \
              wayland-devel libpulse-devel libudev-devel libplacebo-devel

            curl -sSL https://github.com/jurplel/install-qt-action/releases/download/v3.0.0/install-qt.sh | bash -s -- \
              --version $QT_VERSION \
              --host linux \
              --target desktop \
              --modules qtmultimedia

            rm -rf build .qmake.cache .qmake.stash
            export PATH=\"\$HOME/Qt/$QT_VERSION/bin:\$PATH\"
            qmake6 artemis.pro CONFIG+=release QMAKE_CXXFLAGS+=\"-fPIC\"
            make -j\$(nproc)

            mkdir -p package/{bin,lib}
            cp app/artemis package/bin/
            ldd app/artemis \
              | grep -E 'libQt6|libSDL2|libopus|libssl|libav' \
              | awk '{print \$3}' \
              | xargs -I{} cp {} package/lib/

            # Create installer script
            cat > package/install.sh << 'EOF'
            #!/usr/bin/env bash
            DEST=\"\$HOME/.local/share/artemis\"
            BIN=\"\$HOME/.local/bin\"
            mkdir -p \"\$DEST\" \"\$BIN\"
            cp -r * \"\$DEST/\"
            ln -sf \"\$DEST/artemis\" \"\$BIN/artemis\"
            cat > \"\$HOME/.local/share/applications/artemis.desktop\" << EOD
            [Desktop Entry]
            Type=Application
            Name=Artemis Desktop
            Exec=artemis
            Icon=artemis
            Categories=Game;Network;
            EOD
            echo \"Installed Artemis to \$DEST; launcher: artemis\"
            EOF
            chmod +x package/install.sh

            TAR=artemis-linux-\${GITHUB_REF_NAME:-build\${GITHUB_RUN_NUMBER}}.tar.gz
            tar czf \$TAR -C package .
            echo \"\$TAR\"
          " > cont-build-output.txt

      - name: Read package path
        id: archive
        run: |
          PACKAGE=$(tail -n1 cont-build-output.txt)
          echo "::set-output name=package-path::\$PACKAGE"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artemis-linux
          path: ${{ steps.archive.outputs.package-path }}

  release:
    name: Create GitHub Release
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: artemis-linux
          path: release-package

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release-package/${{ needs.build-linux.outputs.package-path }}
          asset_name: ${{ needs.build-linux.outputs.package-path }}
          asset_content_type: application/gzip
