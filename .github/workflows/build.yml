name: Linux Development Build & Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'

jobs:
  build-linux:
    name: Build on Fedora Linux
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    outputs:
      package-path: ${{ steps.archive.outputs.package-path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Fedora build tools & dependencies
        run: |
          dnf -y update
          dnf -y groupinstall "Development Tools"
          dnf -y install \
            qt6-qtbase-devel qt6-qttools-devel qt6-qtmultimedia-devel \
            openssl-devel SDL2-devel SDL2_ttf-devel opus-devel ffmpeg-devel \
            libX11-devel libXcursor-devel libXext-devel libXi-devel \
            libXrandr-devel freetype-devel mesa-libGL-devel \
            wayland-devel libpulse-devel libudev-devel libplacebo-devel

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          modules: qtmultimedia

      - name: Clean and Build
        run: |
          rm -rf build .qmake.cache .qmake.stash
          qmake6 artemis.pro CONFIG+=release QMAKE_CXXFLAGS+="-fPIC"
          make -j$(nproc)

      - name: Bundle & Package
        id: archive
        run: |
          mkdir -p package/{bin,lib}
          cp app/artemis package/bin/
          ldd app/artemis \
            | grep -E "libQt6|libSDL2|libopus|libssl|libav" \
            | awk '{print $3}' \
            | xargs -I{} cp {} package/lib/
          # Create installer script here as before...
          tar czf artemis-linux-${{ github.ref_name || github.run_number }}.tar.gz -C package .
          echo "::set-output name=package-path::artemis-linux-${{ github.ref_name || github.run_number }}.tar.gz"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artemis-linux
          path: ${{ steps.archive.outputs.package-path }}

  release:
    name: Create GitHub Release
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: artemis-linux
          path: release-package

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release-package/${{ needs.build-linux.outputs.package-path }}
          asset_name: artemis-linux-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip
